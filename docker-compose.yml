
services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: it-asset-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-it_assets}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-it_assets}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - it-asset-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: it-asset-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - it-asset-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it-asset-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-it_assets}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-secret-key-change-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      # Runtime environment variables with secure defaults
      # JWT_SECRET must be at least 32 characters - generate a secure one for production!
      - JWT_SECRET=${JWT_SECRET:-$(openssl rand -base64 48 | tr -d "=+/" | cut -c1-64)}
      - CRON_SECRET_TOKEN=${CRON_SECRET_TOKEN:-$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-32)}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-it_assets}
      - REDIS_URL=redis://redis:6379
      - CSRF_SECRET=${CSRF_SECRET:-$(openssl rand -base64 48 | tr -d "=+/" | cut -c1-64)}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run migrations before starting the app
    command: >
      sh -c "node scripts/migrate.js && node server.js"
    networks:
      - it-asset-network

volumes:
  postgres_data:
  redis_data:

networks:
  it-asset-network:
    driver: bridge
